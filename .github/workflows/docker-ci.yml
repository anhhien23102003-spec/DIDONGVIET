name: Docker CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: didong:ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_TAG }}

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --rm --name didong-test -p 5000:5000 "${IMAGE_TAG}"
          trap 'docker rm -f didong-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5000 >/tmp/didong_health.html 2>/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5000 >/dev/null
