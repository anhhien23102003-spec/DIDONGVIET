version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: didong
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
